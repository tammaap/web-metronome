<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Metronome</title>
</head>

<body>

  <div class="container">
    <div class="metronome">

      <!-- HEADER -->

      <div class="header">

        <div class="header-left">

          <span class="system-name">
            SESSION TEMPO
          </span>

          <span class="module-code">
            SC-01
          </span>

        </div>

        <div class="header-right">

          <!-- <span class="status-dot"></span>

          <span>
            RECORDING
          </span> -->

        </div>

      </div>


      <!-- MAIN BPM DISPLAY -->

      <div class="bpm-section">

        <div class="display-label">

          <!-- <span class="label-diamond">◆</span>
          <span class="line"></span>
          <span class="label-diamond">◆</span> -->

        </div>

        <div class="bpm-display">

          <span class="tempo">
            120
          </span>

          <span class="bpm">
            BPM
          </span>

        </div>


        <div class="tempo-text">
          Allegro
        </div>

      </div>



      <div class="tempo-settings">

        <button
          type="button"
          class="adjust-tempo-btn decrease-tempo"
          aria-label="Decrease tempo"
        >
          −
        </button>


        <input
          type="range"
          min="20"
          max="280"
          step="1"
          value="120"
          class="slider"
        >


        <button
          type="button"
          class="adjust-tempo-btn increase-tempo"
          aria-label="Increase tempo"
        >
          +
        </button>

      </div>



      <div class="beat-indicators"></div>



      <div class="transport">

        <button
          type="button"
          class="start-stop"
          aria-label="Start metronome"
        >
          ▶
        </button>

      </div>



      <div class="measures">

        <div class="measure-display">

          <span class="measure-label">
            TIME SIGNATURE
          </span>

          <select class="time-signature">
            <option value="2/4">2/4</option>
            <option value="3/4">3/4</option>
            <option value="4/4" selected>4/4</option>
            <option value="5/4">5/4</option>
            <option value="6/8">6/8</option>
            <option value="7/8">7/8</option>
            <option value="9/8">9/8</option>
            <option value="12/8">12/8</option>
          </select>

        </div>

      </div>



      <!-- SILKSCREEN  -->

      <div class="pcb-shortcuts">

        <span class="pcb-shortcuts-title">SHORTCUTS</span>

        <p><kbd>SPACE</kbd><span>START / STOP</span></p>
        <p><kbd>T</kbd><span>TAP TEMPO</span></p>
        <p><kbd>← →</kbd><span>BPM + / - 1</span></p>
        <p><kbd>SHIFT</kbd><span>BPM + / - 10</span></p>
        <p><kbd>↑ ↓</kbd><span>TIME SIGNATURE</span></p>

      </div>



      <div class="footer">

        <span class="pcb-note note-panic">
          DO NOT PANIC
        </span>

        <span class="pcb-note note-click">
          TRUST THE CLICK
        </span>

      </div>


      <span class="pcb-mark mark-top-right">
        01
      </span>


    </div>

  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
